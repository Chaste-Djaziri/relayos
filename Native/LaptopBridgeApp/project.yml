# Path: Native/LaptopBridgeApp/project.yml
# Regenerate with: cd Native/LaptopBridgeApp && xcodegen generate
# The Xcode Debug app is deliberately isolated from the installed MCP agent.
name: RelayOS
options:
  xcodeVersion: "16.0"
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  RelayOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/LaptopBridgeApp
    info:
      path: Xcode/RelayOS-Info.plist
      properties:
        CFBundleDisplayName: RelayOS
        CFBundleName: RelayOS
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleExecutable: RelayOS
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSAppleEventsUsageDescription: "RelayOS controls other apps only after explicit local approval."
        NSScreenCaptureUsageDescription: "RelayOS captures the display only after you approve a screen action."
    settings:
      base:
        PRODUCT_NAME: RelayOS
        PRODUCT_MODULE_NAME: LaptopBridgeApp
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: RelayOS
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: pro.micorp.relayos.dev
          ENABLE_PREVIEWS: YES
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: pro.micorp.relayos
    scheme: {}
  RelayOSTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/LaptopBridgeAppTests
    dependencies:
      - target: RelayOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pro.micorp.relayos.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RelayOS.app/Contents/MacOS/RelayOS"
        BUNDLE_LOADER: "$(TEST_HOST)"
