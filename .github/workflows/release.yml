name: RelayOS release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Build RelayOS DMG
        run: ./scripts/build_macos_dmg.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RelayOS-macOS
          path: dist/RelayOS.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Build native Windows package
        shell: pwsh
        run: |
          $version = "0.1.0"
          if ("${{ github.ref }}" -like "refs/tags/v*") { $version = "${{ github.ref_name }}".Substring(1) }
          .\scripts\build_windows_native.ps1 -Version $version
      - name: Verify self-contained Windows payload
        shell: pwsh
        run: |
          $stage = "dist\windows-native\RelayOS"
          foreach ($asset in @("RelayOSWindows.exe", "Microsoft.UI.Xaml.dll", "Runtime\RelayOSServer.exe")) {
            if (-not (Test-Path (Join-Path $stage $asset))) { throw "Missing self-contained payload asset: $asset" }
          }
          if (-not (Get-ChildItem -LiteralPath $stage -Filter "Microsoft.WindowsAppRuntime*.dll" -ErrorAction SilentlyContinue)) {
            throw "Windows App SDK runtime binaries were not staged"
          }
          if (Test-Path (Join-Path $stage "WindowsAppRuntimeInstall.exe")) { throw "Framework-dependent runtime installer must not be bundled" }
          if (-not (Get-ChildItem "dist\installer\RelayOS-Setup-*.exe" -ErrorAction SilentlyContinue)) { throw "Expected RelayOS Setup installer was not produced" }
      - uses: actions/upload-artifact@v4
        with:
          name: RelayOS-Windows
          path: |
            dist/installer/RelayOS-Setup-*.exe
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      # GitHub CLI needs repository context for `gh release` and `gh api`.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RelayOS-macOS
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: RelayOS-Windows
          path: release-assets
      - name: Publish nightly assets
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view nightly >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" -f sha="${GITHUB_SHA}" -F force=true
          else
            gh release create nightly --target "${GITHUB_SHA}" --title "RelayOS nightly" --prerelease --generate-notes
          fi
          gh release upload nightly release-assets/* --clobber
      - name: Publish versioned release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          overwrite_files: true
          generate_release_notes: true
