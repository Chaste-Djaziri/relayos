name: RelayOS release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Build RelayOS DMG
        run: ./scripts/build_macos_dmg.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RelayOS-macOS
          path: dist/RelayOS.dmg
          if-no-files-found: error
      - name: Publish nightly GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep the rolling nightly tag and release attached to this build.
          if gh release view nightly >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" \
              -f sha="${GITHUB_SHA}" \
              -F force=true
          else
            gh release create nightly \
              --target "${GITHUB_SHA}" \
              --title "RelayOS nightly" \
              --prerelease
          fi
          gh release upload nightly dist/RelayOS.dmg --clobber
      - name: Publish versioned GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RelayOS.dmg
          overwrite_files: true
          generate_release_notes: true
