# Path: .github/workflows/release.yml
name: RelayOS macOS release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relayos-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Build download website
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build static website
        run: npm run build
      - name: Validate public download links and Windows availability
        run: |
          test -s out/index.html
          grep -q 'releases/download/nightly/RelayOS.dmg' out/index.html
          grep -q 'Coming Soon' out/index.html
          if grep -q 'RelayOS-Setup-.*\.exe' out/index.html; then
            echo "::error::Windows installers must not be advertised before launch"
            exit 1
          fi
      - name: Upload validated website
        uses: actions/upload-artifact@v4
        with:
          name: RelayOS-website
          path: website/out/
          if-no-files-found: error
      - name: Deploy to Vercel (when deployment secrets are configured)
        if: github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Vercel deployment secrets not configured; connected Git integration may deploy the pushed site."
            exit 0
          fi
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

  macos:
    name: Test and package Apple Silicon DMG
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check build environment
        run: |
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          swift --version
          python --version
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Run Python tests
        run: python -m pytest -q
      - name: Run native Swift tests
        run: swift test --package-path Native/LaptopBridgeApp
      - name: Build bundled native application and DMG
        run: ./scripts/build_macos_dmg.sh
      - name: Verify bundle, packaged helpers, DMG and architecture
        run: |
          set -eu
          APP="dist/RelayOS.app"
          test -x "$APP/Contents/MacOS/RelayOS"
          test -x "$APP/Contents/Resources/Runtime/RelayOSMCPServer"
          test -x "$APP/Contents/Resources/Runtime/RelayOSApprovals"
          test -x "$APP/Contents/Resources/Runtime/RelayOSScreenCapture"
          test -s dist/RelayOS.dmg
          codesign --verify --deep --strict "$APP"
          codesign --verify --strict "$APP/Contents/Resources/Runtime/RelayOSScreenCapture"
          file "$APP/Contents/MacOS/RelayOS" | grep -q arm64
          file "$APP/Contents/Resources/Runtime/RelayOSMCPServer" | grep -q arm64
          file "$APP/Contents/Resources/Runtime/RelayOSScreenCapture" | grep -q arm64
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist" | grep -qx 'pro.micorp.relayos'
          hdiutil verify dist/RelayOS.dmg
          mkdir -p "$RUNNER_TEMP/relayos-dmg-check"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/relayos-dmg-check" dist/RelayOS.dmg
          test -d "$RUNNER_TEMP/relayos-dmg-check/RelayOS.app"
          test -L "$RUNNER_TEMP/relayos-dmg-check/Applications"
          hdiutil detach "$RUNNER_TEMP/relayos-dmg-check"
          cd dist
          shasum -a 256 RelayOS.dmg > RelayOS.dmg.sha256
          cat RelayOS.dmg.sha256
      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RelayOS-macOS
          path: |
            dist/RelayOS.dmg
            dist/RelayOS.dmg.sha256
          if-no-files-found: error

  publish:
    name: Publish verified macOS assets to GitHub Releases
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [website, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RelayOS-macOS
          path: release-assets
      - name: Validate downloaded release payload
        run: |
          set -eu
          test -s release-assets/RelayOS.dmg
          test -s release-assets/RelayOS.dmg.sha256
          (cd release-assets && sha256sum -c RelayOS.dmg.sha256)
      - name: Publish rolling nightly (macOS only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view nightly >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" -f sha="${GITHUB_SHA}" -F force=true
          else
            gh release create nightly --target "${GITHUB_SHA}" --title "RelayOS nightly · macOS Apple Silicon" --prerelease --notes "Apple Silicon macOS 14+. Windows is coming soon. Development build; see asset checksum for verification."
          fi
          gh release upload nightly release-assets/RelayOS.dmg release-assets/RelayOS.dmg.sha256 --clobber
          # Historical nightly releases must not continue offering an obsolete
          # Windows installer once the website says Windows is coming soon.
          while IFS= read -r asset; do
            case "$asset" in
              RelayOS-Windows*.zip|RelayOS-Setup-*.exe|RelayOSWindows.exe)
                gh release delete-asset nightly "$asset" --yes ;;
            esac
          done < <(gh release view nightly --json assets --jq '.assets[].name')
          gh release view nightly --json assets --jq '.assets[].name'
      - name: Publish versioned macOS release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          overwrite_files: true
          generate_release_notes: true
          prerelease: false
